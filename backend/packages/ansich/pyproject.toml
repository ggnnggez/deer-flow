[project]
name = "ansich-core"
version = "0.1.0"
description = "Framework-independent world model and observation contracts for Ansich"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ansich"]
