[project]
name = "deerflow-extension-context-residency"
version = "0.1.0"
description = "Records which content blocks each model request carried, per task, so a reader can answer when a block entered the context, how long it stayed and what removed it"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "deerflow-extension-api>=0.2.6,<0.3",
    "langchain>=1.2,<2",
    "langchain-core>=1.2,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.12,<3",
    "sqlalchemy>=2.0,<3",
]

[project.entry-points."deerflow.extensions"]
context-residency = "deerflow_extension_context_residency:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_extension_context_residency"]
